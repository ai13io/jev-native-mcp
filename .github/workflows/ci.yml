name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"
          - os: ubuntu-latest
            python: "3.13"
          - os: macos-latest
            python: "3.12"
          - os: windows-latest
            python: "3.12"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: server/pyproject.toml

      - name: Install test dependencies
        run: python -m pip install -e "./server[dev]"

      - name: Run server tests
        run: python -m pytest server/tests

      - name: Run workflow and packaging tests
        run: |
          python -m pytest tools/test_configure_profile.py
          python -m pytest scripts/test_package_portable.py
          python -m pytest skills/jev-pentest/scripts/test_public_source_audit.py
          python -m pytest skills/jev-pentest/scripts/test_evaluate_source_audit.py

      - name: Verify release tree
        run: python scripts/verify_release.py
